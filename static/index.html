<!DOCTYPE html>
<!--
  模块职责：personal-agent 的单文件可视化前端（原生 HTML+CSS+JS）。
  - 左侧/顶部侧边栏：展示待办（GET /api/notes），支持勾选完成
    （PATCH /api/notes/{id}/status）与「全部/待办/已完成」筛选；
    勾选采用乐观更新，失败回滚并 toast 提示；
  - 主区：聊天界面（POST /api/chat），Agent 回复带「思考过程」折叠区。
    打开页面时用 GET /api/messages 回填历史对话（刷新不丢上下文），
    回填期间锁住发送，避免新旧消息交错；
  - 溯源跳转（V6）：点侧边栏卡片定位到产生这条记录的那轮对话
    （每条气泡挂 id="msg-{message_id}" 锚点），目标消息闪 3 下高亮；
    没有来源（老数据）或跨会话的记录会给出明确提示，不做假跳转。
  - 不引入任何框架与 CDN：样式和脚本全部内联，离线也能打开页面。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport 是移动端正确缩放的唯一入口，缺了手机端会按桌面宽度渲染 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人 AI 助手</title>
  <style>
    /* ===== 设计变量：统一浅色主题、圆角与阴影，方便整体调色 ===== */
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e6e9f2;
      --text: #223047;
      --muted: #7b8498;
      --primary: #4f6ef7;
      --primary-soft: #eef1fe;
      --code-bg: #f5f7fc;
      --danger: #d94b5f;
      --radius: 14px;
      --shadow: 0 1px 4px rgba(31, 41, 55, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      /* 优先使用 macOS/移动端默认中文字体栈，避免引入网络字体 */
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    /* ===== 整体布局：桌面左右两栏，手机由媒体查询改成上下结构 ===== */
    .app {
      display: flex;
      /* 100dvh 更贴近真实可视区；先写 100vh 作为老浏览器兜底 */
      height: 100vh;
      height: 100dvh;
    }

    /* ===== 侧边栏（待办区） ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 290px;
      min-width: 290px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 17px;
    }

    .icon-button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .icon-button:hover {
      background: var(--bg);
      color: var(--text);
    }

    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== 待办筛选（全部 / 待办 / 已完成） ===== */
    .todo-filters {
      display: flex;
      gap: 6px;
      padding: 8px 10px 0;
    }

    .filter-button {
      flex: 1;                 /* 三等分铺满侧边栏，避免按钮宽度随文案抖动 */
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      padding: 5px 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .filter-button:hover {
      color: var(--text);
    }

    .filter-button.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      padding: 18px 8px;
    }

    .todo-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      word-break: break-word;
      /* 卡片整体可点（跳回产生这条计划的对话）：光标给出手感，
       * transition + hover 变色提示「这里能点」，否则用户不知道有这个能力 */
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .todo-item:hover {
      border-color: var(--primary);
    }

    /* 已完成条目整体置灰：状态一眼可辨，但条目不删除，保留可追溯性 */
    .todo-item.done {
      opacity: 0.6;
    }

    /* 删除线只加在正文上：直接写在卡片上会把标签、时间也划掉，反而难读 */
    .todo-item.done .todo-content {
      text-decoration: line-through;
    }

    .todo-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* 勾选框与正文同一行：flex-start 让勾选框顶部对齐正文首行 */
    .todo-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .todo-check {
      width: 16px;
      height: 16px;
      flex-shrink: 0;          /* 长文本换行时勾选框不许被压扁 */
      margin: 1px 0 0;         /* 微调 1px，让勾与首行文字视觉居中对齐 */
      cursor: pointer;
      accent-color: var(--primary);  /* 跟随主题色，避免浏览器默认蓝绿跳色 */
    }

    .todo-check:disabled {
      cursor: progress;        /* 请求在途：提示“正在保存”，同时防止连点 */
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 每种笔记类型一种柔和配色，扫一眼即可区分用途 */
    .tag-task    { background: #e8edff; color: #3f51c9; }
    .tag-wish    { background: #fde8f3; color: #b23b83; }
    .tag-idea    { background: #dcf7f7; color: #0f7f86; }
    .tag-emotion { background: #fdf0d6; color: #a06a08; }
    .tag-plan    { background: #e4f6e8; color: #2c7a45; }
    .tag-default { background: #eceef4; color: #5b6472; }

    .todo-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .todo-content {
      font-size: 13px;
      line-height: 1.45;
      flex: 1;                 /* 占满勾选框之外的宽度，长文本正常换行 */
      min-width: 0;
    }

    /* ===== 轻提示 toast：接口失败等一次性反馈，自动消失 ===== */
    .toast-stack {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 50;
      /* 容器不吃点击事件，否则这块透明区域会挡住下方输入框 */
      pointer-events: none;
    }

    .toast {
      background: rgba(34, 48, 71, 0.92);
      color: #ffffff;
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 14px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-width: 80vw;
    }

    /* 失败提示用危险色，和成功/中性提示区分开 */
    .toast.error {
      background: rgba(217, 75, 95, 0.95);
    }

    /* ===== 主区：聊天 ===== */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(4px);
    }

    .chat-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .chat-header .subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    /* 消息滚动区必须 min-height:0，否则内容多了会把输入框挤出屏幕 */
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.agent {
      justify-content: flex-start;
    }

    /* 圆角气泡：用户/Agent 各占一端；white-space 保留换行让长回复可读 */
    .bubble {
      max-width: 76%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .message.user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.agent .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.agent-body {
      max-width: 86%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    /*
     * 溯源跳转的闪烁高亮：点计划卡片跳到某条消息时闪 3 下。
     * 用 CSS @keyframes 而不是 JS 定时器改样式——动画交给合成器跑，
     * 不占主线程，也不会因为 setTimeout 叠加产生抖动；
     * 动画次数写死 3 次（任务要求的「闪烁 3 次」），结束后由 JS 监听
     * animationend 摘掉类名，下次点击才能重新触发同一段动画。
     */
    @keyframes flash-message {
      0%, 100% { background-color: transparent; }
      50%      { background-color: #fff3b0; }
    }

    .message.flash-target {
      animation: flash-message 0.45s ease-in-out 3;
      border-radius: var(--radius);
    }

    /* 思考过程折叠区：默认收起，需要时再展开，不打断阅读流 */
    details.thinking {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }

    details.thinking summary {
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }

    details.thinking[open] summary {
      margin-bottom: 8px;
      color: var(--text);
    }

    .no-tools {
      color: var(--muted);
      padding: 2px 0;
    }

    .tool-card {
      border: 1px solid var(--border);
      background: var(--primary-soft);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .tool-card:last-child {
      margin-bottom: 0;
    }

    /* ===== trace 时间线：左侧竖线 + 圆点节点串起“模型思考/执行工具” ===== */
    .trace-timeline {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2px 0 2px 14px;
    }

    /* 竖线画在整个容器左侧，各卡片自然按数组顺序从上往下排 */
    .trace-timeline::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }

    .trace-card {
      position: relative;
    }

    /* 每个节点一个圆点压在线条上，配合标题里的“第 N 轮”形成时间感 */
    .trace-card::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 13px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }

    /* 模型步卡片：浅色独立卡片，与工具卡片区分“决定”与“执行” */
    .model-step {
      margin: 0;
      background: #f8f9ff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .step-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .step-desc {
      font-size: 12px;
      line-height: 1.55;
    }

    /* 正文预览刻意做成灰色小字，避免抢占“发生了什么”的视觉焦点 */
    .step-preview {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* trace 里的工具步复用 tool-card 视觉；间距交给时间线 gap 管理 */
    .tool-step {
      margin-bottom: 0;
    }

    /* messages 调试视图：与工具卡片同级但视觉弱化，
       用虚线分隔表示它只是“旁路观测”，不是对话内容的一部分 */
    details.messages-view {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    details.messages-view summary {
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }

    details.messages-view[open] summary {
      color: var(--text);
      margin-bottom: 6px;
    }

    /* 调试说明与系统提示同框展示；整段 JSON 可能很长，
       限制高度后内部滚动，避免撑爆整个思考折叠区 */
    .debug-note {
      color: var(--danger);
      font-size: 11px;
      line-height: 1.5;
      margin: 4px 0 8px;
    }

    details.messages-view pre {
      max-height: 360px;
      overflow: auto;
    }

    .tool-name {
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .block-title {
      color: var(--muted);
      margin: 8px 0 4px;
    }

    /* pre 等宽 + 保留换行：args/result 是结构化文本，不能压缩成一行 */
    .code {
      margin: 0;
      padding: 8px 10px;
      background: var(--code-bg);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .error-message {
      text-align: center;
      color: var(--danger);
      font-size: 13px;
      padding: 8px;
    }

    /* ===== 输入区 ===== */
    .status-line {
      min-height: 20px;
      padding: 4px 18px 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 14px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      background: var(--bg);
      color: var(--text);
      max-height: 140px;
    }

    .composer textarea:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .composer textarea:disabled {
      opacity: 0.65;
    }

    .send-button {
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== 移动端（<640px）：侧边栏移到顶部，主区占满剩余高度 ===== */
    @media (max-width: 639px) {
      .app {
        flex-direction: column;
      }

      /* 顶部待办区限高并允许内部滚动，避免把聊天区挤没 */
      .sidebar {
        width: 100%;
        min-width: 0;
        max-height: 34vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .todo-list {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .todo-item {
        min-width: 220px;
      }

      .chat-header {
        padding: 10px 12px;
      }

      .chat-header .subtitle {
        display: none;
      }

      .messages {
        padding: 12px;
      }

      /* 触屏目标别太小：输入区与按钮高度保持易点按 */
      .composer {
        padding: 8px 10px;
      }

      .bubble {
        max-width: 88%;
      }

      .message.agent-body {
        max-width: 94%;
      }
    }

    /* 内层调试折叠块要“自成一体”：外层的 [open] 规则带 margin/颜色，
       会意外作用到后代 summary，这里显式覆盖回来保证两级标题样式独立 */
    details.thinking details.messages-view summary {
      margin: 0 0 6px;
      color: var(--muted);
    }

    details.thinking details.messages-view[open] summary {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 侧边栏：桌面在左，移动端通过 CSS 排到顶部 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>待办</h1>
        <button class="icon-button" id="refresh-todos" type="button" title="刷新待办">⟳</button>
      </div>
      <!-- 筛选切换：data-filter 的值直接作为 /api/notes?status= 的取值，
           all 表示不传参（后端返回全部），避免前后端各维护一份映射 -->
      <div class="todo-filters" id="todo-filters">
        <button class="filter-button active" data-filter="all" type="button">全部</button>
        <button class="filter-button" data-filter="open" type="button">待办</button>
        <button class="filter-button" data-filter="done" type="button">已完成</button>
      </div>
      <div class="todo-list" id="todo-list">
        <div class="empty">加载中…</div>
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <h2>个人 AI 助手</h2>
        <span class="subtitle">基于你的日记、笔记与长期记忆回答</span>
      </header>

      <!-- 消息区：用户/Agent 气泡都会 append 到这里 -->
      <div class="messages" id="messages"></div>

      <!-- 状态行：请求期间显示“思考中…”，平时保持占位防止布局跳动 -->
      <div class="status-line" id="status-line"></div>

      <!-- 输入区：回车发送（Shift+回车换行） -->
      <form class="composer" id="chat-form">
        <textarea
          id="message-input"
          rows="1"
          placeholder="问我关于你日记的问题，或说“提醒我……”"
          autocomplete="off"
        ></textarea>
        <button class="send-button" id="send-button" type="submit">发送</button>
      </form>
    </main>
  </div>

  <!-- 轻提示挂载点：JS 动态往里塞 .toast，用完自动移除 -->
  <div class="toast-stack" id="toast-stack"></div>

  <script>
    // ===== 会话标识：localStorage 持久化 =====
    // 为什么必须持久化：服务端用 session_id 关联历史消息；
    // 每次刷新都换新 id 会让 Agent 丢失上文，像“失忆”一样。
    // 为什么用 localStorage 而不是 cookie：这是纯前端单页，
    // 后端不读 cookie，localStorage 更简单且不随请求带上多余状态。
    const SESSION_STORAGE_KEY = "personal-agent-session-id";

    // 类型显示文案与标签配色映射（后端只存英文枚举，前端负责本地化）
    const NOTE_TYPE_LABELS = {
      task: "任务",
      wish: "愿望",
      idea: "想法",
      emotion: "情绪",
      plan: "计划"
    };
    const NOTE_TYPE_CLASSES = {
      task: "tag-task",
      wish: "tag-wish",
      idea: "tag-idea",
      emotion: "tag-emotion",
      plan: "tag-plan"
    };

    // 工具名 → 中文展示名：思考过程卡片里优先显示中文，保留原名便于对照接口
    const TOOL_LABELS = {
      search_journal: "检索日记",
      create_note: "记录笔记",
      save_profile: "保存画像"
    };

    // ===== DOM 引用集中声明，避免每次事件都重新查询 =====
    const messagesEl = document.getElementById("messages");
    const todoListEl = document.getElementById("todo-list");
    const statusLineEl = document.getElementById("status-line");
    const chatFormEl = document.getElementById("chat-form");
    const messageInputEl = document.getElementById("message-input");
    const sendButtonEl = document.getElementById("send-button");
    const refreshButtonEl = document.getElementById("refresh-todos");
    const todoFiltersEl = document.getElementById("todo-filters");
    const toastStackEl = document.getElementById("toast-stack");

    // 是否正在等后端：防止用户连续发送导致上下文/状态错乱
    let busy = false;

    // 是否正在回填历史对话：拉历史期间必须挡住发送，
    // 否则「回填的旧消息」和「刚发的新消息」会交错 append，
    // 对话区顺序对不上，用户会以为消息丢了或重复了
    let isLoadingHistory = false;

    // 当前待办筛选：'all' / 'open' / 'done'，与 .filter-button 的 data-filter 一致。
    // 只存这一份状态，渲染时按需拼查询参数，避免筛选状态散落在 DOM 里
    let todoFilter = "all";

    /**
     * 弹出一次性轻提示（如接口失败），若干秒后自动消失。
     * 参数：
     *   message：提示文案；
     *   kind：'info' / 'error'，error 用危险色区分。
     * 返回值：无。
     * 副作用：向 #toast-stack 追加节点并延时移除。
     */
    function showToast(message, kind) {
      const toast = createEl("div", "toast" + (kind === "error" ? " error" : ""), message);
      toastStackEl.appendChild(toast);
      // 2.6s 后移除：足够读完一句短提示，又不会长期占屏
      setTimeout(function () {
        toast.remove();
      }, 2600);
    }

    /**
     * 取（或创建并持久化）本浏览器的 session_id。
     * 返回：session_id 字符串。
     * crypto.randomUUID() 需要安全上下文，127.0.0.1 满足要求；
     * localStorage 在隐私模式下可能抛异常，读取/写入都要容错。
     */
    function getSessionId() {
      let sessionId = "";
      try {
        sessionId = localStorage.getItem(SESSION_STORAGE_KEY) || "";
      } catch (error) {
        console.warn("无法读取 localStorage，本次将使用临时会话：", error);
      }
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        try {
          localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
        } catch (error) {
          console.warn("无法写入 localStorage，会话只在本次页面生效：", error);
        }
      }
      return sessionId;
    }

    /**
     * 把会话 ID 写进 localStorage，保证后续刷新都落到同一个会话上。
     * 参数：sessionId——服务端确认过的会话 ID（空值直接忽略）。
     * 返回值：无。
     * 副作用：写 localStorage（隐私模式下会抛异常，只告警不中断）。
     *
     * 为什么要覆盖写入：回填历史时若发现本浏览器没有消息、而服务端
     * 返回了「最近一次会话」，就得把会话认下来；不写回的话，
     * 每次刷新都会先拿一个空会话白查一次，还会留下一个永远没消息的
     * 幽灵 session_id。
     */
    function setSessionId(sessionId) {
      if (!sessionId) {
        return;
      }
      try {
        localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
      } catch (error) {
        console.warn("无法写入 localStorage，本次会话不持久化：", error);
      }
    }

    /**
     * DOM 创建小工具：所有文本用 textContent 赋值而非 innerHTML，
     * 从根上避免用户/模型内容里的 HTML 被当标签执行（XSS 防护）。
     */
    function createEl(tag, className, text) {
      const node = document.createElement(tag);
      if (className) {
        node.className = className;
      }
      if (text !== undefined && text !== null) {
        node.textContent = text;
      }
      return node;
    }

    /**
     * 把 ISO 时间格式化成“MM-DD HH:mm”。
     * 参数非法时原样返回，避免异常输入让整个列表渲染失败。
     */
    function formatTime(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) {
        return isoString;
      }
      const pad = function (value) {
        return String(value).padStart(2, "0");
      };
      return (
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate()) +
        " " +
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes())
      );
    }

    /**
     * 拉取 /api/notes 并渲染待办列表。
     * 页面加载与每次聊天结束都会调用——Agent 的 create_note
     * 会写库，只有重新拉取侧边栏才能看到最新记录。
     * 当前筛选（全部/待办/已完成）会拼成 status 查询参数下推到后端，
     * 由数据库完成过滤，而不是把全量数据拉到浏览器再筛。
     */
    async function loadTodos() {
      todoListEl.replaceChildren(createEl("div", "empty", "加载中…"));
      try {
        // todoFilter 为 'all' 时不带参数，语义与后端「不过滤」一致
        const query = todoFilter === "all" ? "" : "?status=" + todoFilter;
        const response = await fetch("/api/notes" + query);
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const items = await response.json();
        renderTodos(items);
      } catch (error) {
        console.error("待办加载失败：", error);
        todoListEl.replaceChildren(
          createEl("div", "empty", "待办加载失败，点右上角重试")
        );
      }
    }

    /**
     * 把待办数组渲染成侧边栏卡片列表。
     * 参数：items——后端返回的 [{id, type, content, status, created_at}, ...]。
     */
    function renderTodos(items) {
      if (!Array.isArray(items) || items.length === 0) {
        // 空态文案跟随筛选：说清「没有待办」和「还没有已完成的」是两回事
        const emptyText =
          todoFilter === "done"
            ? "还没有已完成的条目"
            : todoFilter === "open"
              ? "没有待办事项"
              : "暂无待办";
        todoListEl.replaceChildren(createEl("div", "empty", emptyText));
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach(function (item) {
        const card = createEl("div", "todo-item");
        const top = createEl("div", "todo-top");

        // 未知类型仍显示原文并使用中性色，不因后端新增枚举而报错
        const type = item.type || "unknown";
        const tagClass = NOTE_TYPE_CLASSES[type] || "tag-default";
        const tagText = NOTE_TYPE_LABELS[type] || type;
        top.appendChild(createEl("span", "tag " + tagClass, tagText));
        top.appendChild(createEl("span", "todo-time", formatTime(item.created_at)));

        // 正文行 = 勾选框 + 内容；勾选状态以后端 status 为唯一事实来源，
        // 旧数据没有 status 字段时按 open 处理，避免渲染出「已勾选」的假象
        const body = createEl("div", "todo-body");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "todo-check";
        checkbox.checked = item.status === "done";
        checkbox.title = checkbox.checked ? "标记为未完成" : "标记为已完成";
        checkbox.setAttribute("aria-label", "标记“" + (item.content || "") + "”");
        // done 的条目立刻带上置灰样式，和后端返回的状态保持一致
        card.classList.toggle("done", checkbox.checked);
        checkbox.addEventListener("change", function () {
          toggleTodoStatus(item, card, checkbox);
        });
        body.appendChild(checkbox);
        body.appendChild(createEl("div", "todo-content", item.content || ""));

        card.appendChild(top);
        card.appendChild(body);
        // 溯源跳转：整张卡片可点，但勾选框/时间等控件上的点击要放行，
        // 否则用户想勾完成会连带跳到对话区，操作被打断
        card.title = item.source_message_id
          ? "点击定位到产生这条记录的那轮对话"
          : "该记录没有溯源信息";
        card.addEventListener("click", function (event) {
          if (event.target.closest(".todo-check")) {
            return;  // 点在勾选框上 = 改状态，不是跳转
          }
          jumpToSource(item);
        });
        fragment.appendChild(card);
      });
      todoListEl.replaceChildren(fragment);
    }

    /**
     * 切换单条待办的完成状态，并把新状态同步到后端。
     * 参数：
     *   item：渲染时的待办对象（会被就地更新 status，作为乐观更新的本地副本）；
     *   card：该条目的卡片节点（切 .done 样式）；
     *   checkbox：勾选框节点（成功后按服务端返回值校正）。
     * 返回值：无（异步过程；失败时回滚 UI 并弹 toast）。
     * 副作用：PATCH /api/notes/{id}/status，成功后改写数据库 status 字段。
     */
    async function toggleTodoStatus(item, card, checkbox) {
      const prevStatus = item.status === "done" ? "done" : "open";
      const nextStatus = prevStatus === "done" ? "open" : "done";

      // 1) 乐观更新：先按用户点击把界面改掉，避免「点完等半秒才动」的卡顿感
      item.status = nextStatus;
      card.classList.toggle("done", nextStatus === "done");
      checkbox.checked = nextStatus === "done";
      checkbox.title = nextStatus === "done" ? "标记为未完成" : "标记为已完成";
      checkbox.disabled = true;  // 请求在途时禁点，避免连点把状态来回打架

      try {
        const response = await fetch(
          "/api/notes/" + encodeURIComponent(item.id) + "/status",
          {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: nextStatus })
          }
        );
        if (!response.ok) {
          // 后端失败细节（400 非法状态 / 404 笔记不存在）优先透传给用户
          let detail = "";
          try {
            const data = await response.json();
            detail = data && data.detail ? String(data.detail) : "";
          } catch (error) {
            detail = "";
          }
          throw new Error(detail || "HTTP " + response.status);
        }
        // 2) 以服务端返回的权威状态再校正一次界面，
        //    防止将来后端对状态做归一化时前端显示与库里不一致
        const updated = await response.json();
        item.status = updated && updated.status ? updated.status : nextStatus;
        card.classList.toggle("done", item.status === "done");
        checkbox.checked = item.status === "done";
        checkbox.title = checkbox.checked ? "标记为未完成" : "标记为已完成";
      } catch (error) {
        // 3) 回滚：接口失败必须把界面退回点击前的样子，
        //    否则用户以为勾上了，实际数据库里还是原状态
        console.error("待办状态更新失败：", error);
        item.status = prevStatus;
        card.classList.toggle("done", prevStatus === "done");
        checkbox.checked = prevStatus === "done";
        checkbox.title = prevStatus === "done" ? "标记为未完成" : "标记为已完成";
        showToast("勾选没保存成功：" + (error.message || "未知错误"), "error");
      } finally {
        checkbox.disabled = false;
        // 说明：这里不重新拉列表。在「待办/已完成」筛选下，重新拉取会让
        // 刚勾掉的条目当场消失（用户还没看清结果）；留到下次
        // 刷新/切换筛选时再按最新状态过滤即可
      }
    }

    /**
     * 渲染一条用户消息（靠右蓝气泡）。
     * 参数：
     *   text：气泡正文；
     *   messageId：该消息在 messages 表的主键，可选；
     *       传了就挂成 DOM 锚点 id="msg-{id}"，计划卡片才能定位到它。
     * 返回：新建的消息节点（发送方拿它回填后到的 message_id）。
     */
    function appendUserMessage(text, messageId) {
      const wrapper = createEl("div", "message user");
      applyMessageAnchor(wrapper, messageId);
      wrapper.appendChild(createEl("div", "bubble", text));
      messagesEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    /**
     * 给消息节点挂锚点 id（没有 id 就什么都不做）。
     * 参数：
     *   node：消息最外层节点；
     *   messageId：messages 表主键，可为 undefined/null。
     * 返回值：无。
     * 副作用：写 node.id。
     *
     * 为什么统一走这个函数：历史渲染、在线渲染、用户/助手三条路径
     * 都要挂锚点，锚点格式必须完全一致（就是 msg-{id}），
     * 散落各处手写字符串迟早会出现 msg-{id} 和 message-{id} 两种写法，
     * 跳转就找不到节点了。
     */
    function applyMessageAnchor(node, messageId) {
      if (messageId === undefined || messageId === null || messageId === "") {
        return;
      }
      node.id = "msg-" + messageId;
    }

    /**
     * 渲染一条 Agent 回复：正文气泡 + 下方「思考过程」折叠区。
     * trace 是新的逐轮时间线；tool_calls/messages 缺失时兼容旧后端；
     * messages 为本轮实际发给模型的完整上下文，缺失时不渲染调试块。
     * messageId 为后端返回的消息主键，用于挂锚点（可选）。
     */
    function appendAgentMessage(content, toolCalls, messages, trace, messageId) {
      const wrapper = createEl("div", "message agent");
      applyMessageAnchor(wrapper, messageId);
      const body = createEl("div", "message agent-body");
      const text = (content || "").trim();
      body.appendChild(
        createEl("div", "bubble", text || "（本轮没有返回文字回复）")
      );
      body.appendChild(
        buildThinkingDetails(
          Array.isArray(toolCalls) ? toolCalls : [],
          messages,
          trace
        )
      );
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    /**
     * 渲染一条历史里的 Agent 回复（不含逐轮 trace，因为没入库）。
     * 参数：message——GET /api/messages 返回的 assistant 渲染单元，
     *   可能带 tool_calls（仅工具名+返回内容）。
     * 返回值：无。
     * 副作用：向对话区追加节点。
     *
     * 为什么单独一个函数：历史消息只能还原「工具调用」这一层，
     * 不能复用在线渲染（那个带 trace/messages 调试块）。
     * 过程缺失时必须给出明确占位文案，而不是显示成「本轮未调用工具」——
     * 后者会让用户以为 Agent 当时真的没查日记，属于误导。
     */
    function appendHistoryAgentMessage(message) {
      const wrapper = createEl("div", "message agent");
      // 历史消息一律带 id，计划卡片靠它 scrollIntoView 定位
      applyMessageAnchor(wrapper, message.id);
      const body = createEl("div", "message agent-body");
      // content 为空的历史行（例如只调了工具但回复没落库）用占位文案兜底，
      // 否则气泡会渲染成一片空白，用户以为页面坏了
      const text = (message.content || "").trim();
      body.appendChild(createEl("div", "bubble", text || "[过程未记录]"));

      const details = createEl("details", "thinking");
      details.appendChild(createEl("summary", "", "🧠 思考过程"));
      const toolCalls = Array.isArray(message.tool_calls) ? message.tool_calls : [];
      if (toolCalls.length > 0) {
        const container = createEl("div", "tool-cards");
        toolCalls.forEach(function (toolCall) {
          container.appendChild(buildToolCard(toolCall));
        });
        details.appendChild(container);
        details.appendChild(
          createEl(
            "div",
            "no-tools",
            "（历史消息：仅还原工具调用，模型逐轮思考与参数未入库）"
          )
        );
      } else {
        details.appendChild(
          createEl("div", "no-tools", "（历史消息：本轮未记录工具调用）")
        );
      }
      body.appendChild(details);
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
    }

    /**
     * 拉取历史消息（GET /api/messages）。
     * 参数：sessionId——会话 ID；传空串表示不传参，
     *   由服务端返回「最近一次有消息的会话」。
     * 返回：{"session_id": 字符串, "messages": 数组}；
     *   字段缺失时降级成空值，保证调用方不用做空值判断。
     * 异常：HTTP 非 2xx 时抛错，由调用方决定怎么提示。
     */
    async function fetchHistory(sessionId) {
      const query = sessionId
        ? "?session_id=" + encodeURIComponent(sessionId)
        : "";
      const response = await fetch("/api/messages" + query);
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      const data = await response.json();
      return {
        session_id: data && data.session_id ? data.session_id : "",
        messages: data && Array.isArray(data.messages) ? data.messages : []
      };
    }

    /**
     * 把历史消息按「旧→新」渲染进对话区。
     * 参数：messages——fetchHistory 返回的正序渲染单元数组。
     * 返回值：无。
     * 副作用：清空对话区（含首屏欢迎语）后整体重绘，最后滚到最新一条。
     *
     * 为什么先 replaceChildren 整体重绘而不是逐条 append：
     * 欢迎语是首屏写死的节点，逐条 append 会把历史对话接在它后面，
     * 出现「你好，我是你的个人 AI 助手」夹在真实对话中间的错觉。
     */
    function renderHistory(messages) {
      messagesEl.replaceChildren();
      messages.forEach(function (message) {
        if (message.role === "user") {
          // 带上 message.id：渲染完对话区里就有 msg-{id} 锚点可供跳转
          appendUserMessage(message.content || "（空消息）", message.id);
        } else {
          appendHistoryAgentMessage(message);
        }
      });
      scrollToBottom();
    }

    /**
     * 首屏欢迎语：只在「没有任何历史对话」时显示。
     * 有历史时对话区由 renderHistory 整体替换，不会再插这条欢迎语。
     */
    function showWelcomeMessage() {
      const welcome = createEl("div", "message agent");
      const welcomeBody = createEl("div", "message agent-body");
      welcomeBody.appendChild(
        createEl(
          "div",
          "bubble",
          "你好，我是你的个人 AI 助手。可以问我关于日记的问题，也可以说“提醒我……”让我帮你记下待办。"
        )
      );
      welcome.appendChild(welcomeBody);
      messagesEl.appendChild(welcome);
    }

    /**
     * 打开页面时回填历史对话。
     * 参数：无。
     * 返回值：无（异步过程）。
     * 副作用：可能调用 setSessionId 认领服务端返回的会话；
     *   成功后重绘对话区，失败时保留欢迎语并弹 toast。
     *
     * 兜底顺序：先按本浏览器的 session_id 查，空了再查「最近一次会话」。
     * 为什么要有第二层：session_id 存在 localStorage，换浏览器或清缓存
     * 之后就找不到自己的会话了；不兜底的话用户打开页面还是空白，
     * 「刷新恢复上下文」这个需求就没真正满足。
     */
    async function loadHistory() {
      if (isLoadingHistory) {
        return;
      }
      isLoadingHistory = true;
      // 拉历史期间禁用发送按钮（输入框不禁用，用户可以先打字）；
      // 解锁时必须还原成 busy 的真实状态，否则会把「正在等 LLM 回复」
      // 误判成空闲、放行并发发送
      sendButtonEl.disabled = true;
      try {
        let data = await fetchHistory(getSessionId());
        if (data.messages.length === 0) {
          const fallback = await fetchHistory("");
          if (fallback.messages.length > 0) {
            data = fallback;
          }
        }
        // 认领服务端确认的会话 ID，下次刷新直接命中，不再白查一次
        setSessionId(data.session_id);
        if (data.messages.length > 0) {
          renderHistory(data.messages);
        } else {
          showWelcomeMessage();
        }
      } catch (error) {
        console.error("历史对话加载失败：", error);
        // 回填失败不阻断聊天：给欢迎语让页面可用，再提示一句原因
        showWelcomeMessage();
        showToast("历史对话没加载出来，可以直接继续聊", "error");
      } finally {
        isLoadingHistory = false;
        sendButtonEl.disabled = busy;
      }
    }

    // ===== V6：计划卡片溯源跳转（点卡片 → 定位到产生它的那条消息） =====

    /**
     * 查单条消息（GET /api/messages/{id}）。
     * 参数：messageId——messages 表主键。
     * 返回：消息对象（含 session_id/role/content）；后端 404 时返回 null。
     * 异常：网络错误或 5xx 抛出，由调用方 toast。
     *
     * 为什么 404 不当异常抛：计划指向的消息可能被清理掉了，
     * 「查无此消息」是需要如实告诉用户的业务分支，不是程序错误，
     * 混进 catch 里会被当成「网络挂了」，提示就误导了。
     */
    async function fetchMessage(messageId) {
      const response = await fetch(
        "/api/messages/" + encodeURIComponent(messageId)
      );
      if (response.status === 404) {
        return null;
      }
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return await response.json();
    }

    /**
     * 给目标消息做闪烁高亮（CSS 动画闪 3 次后自动恢复）。
     * 参数：node——消息最外层节点。
     * 返回值：无。
     * 副作用：加 .flash-target 类，动画播完自动摘除。
     *
     * 为什么用 animationend 摘类名而不是 setTimeout：
     * 定时器要自己算动画时长（次数×单次时长），以后改 CSS 就得同步改 JS，
     * 容易不同步；animationend 由浏览器在真正播完时派发，
     * 摘掉后下次点击还能重新触发同一段动画。
     */
    function flashMessage(node) {
      node.classList.remove("flash-target");  // 连续点同一条时先复位
      // 强制读一次布局：让浏览器确认类名已摘掉；
      // 否则紧接着的 add 会与 remove 合并成一次变更，动画不会重播
      void node.offsetWidth;
      node.classList.add("flash-target");
      node.addEventListener("animationend", function handler() {
        node.classList.remove("flash-target");
        node.removeEventListener("animationend", handler);
      });
    }

    /**
     * 把对话区滚到目标消息并高亮。
     * 参数：node——目标消息节点。
     * 返回值：无。副作用：滚动对话区 + 触发高亮动画。
     *
     * block:'center' 让目标停在可视区中间（贴边容易被误认为没滚到位），
     * smooth 让用户看清是从当前位置滚过去的，不至于「瞬移」后失去方位感。
     */
    function scrollAndFlash(node) {
      node.scrollIntoView({ behavior: "smooth", block: "center" });
      flashMessage(node);
    }

    /**
     * 点计划卡片的入口：定位到产生这条记录的对话消息。
     * 参数：item——侧边栏 note 对象，需带 source_message_id。
     * 返回值：无（异步过程）。
     * 副作用：滚动/高亮对话区，必要时弹 toast。
     *
     * 兜底顺序：
     * 1) 没有 source_message_id（V6 之前入库的历史记录）→ 直接提示无溯源；
     * 2) 对话区里已有锚点 → 滚过去高亮，这是主路径；
     * 3) 没有锚点 → 查一次消息：确认它存在、并看它属于哪个会话，
     *    再决定是「等历史渲染完重试」还是「跨会话、暂不支持」。
     *
     * TODO: 跨会话跳转。计划卡片的来源消息可能属于别的 session
     * （换过浏览器/清过缓存后新建的会话），要真正跳过去得先按
     * 目标 message.session_id 拉那一段历史再定位；当前版本先如实提示，
     * 不做「把用户丢到错误对话里」的假跳转。
     */
    async function jumpToSource(item) {
      const messageId = item.source_message_id;
      if (!messageId) {
        showToast("该计划无溯源记录", "error");
        return;
      }

      const existing = document.getElementById("msg-" + messageId);
      if (existing) {
        scrollAndFlash(existing);
        return;
      }

      try {
        const message = await fetchMessage(messageId);
        if (!message) {
          showToast("溯源消息已不存在", "error");
          return;
        }
        // 当前会话以 getSessionId() 为准：新消息都发往它，
        // 对话区展示的也是它（loadHistory 认领会话后已写回 localStorage）。
        // 目标消息不属于它 = 跨会话，当前版本不做假跳转
        if (message.session_id !== getSessionId()) {
          showToast("该记录来自其他会话，跨会话跳转暂未支持", "error");
          return;
        }
        // 同会话却找不到节点：多半是启动时历史还在渲染，
        // 隔一小段重试几次即可；不用轮询死等，避免历史加载失败时一直转圈
        for (let attempt = 0; attempt < 3; attempt += 1) {
          await new Promise(function (resolve) {
            setTimeout(resolve, 120);
          });
          const node = document.getElementById("msg-" + messageId);
          if (node) {
            scrollAndFlash(node);
            return;
          }
        }
        showToast("没能定位到那条消息，刷新页面再试", "error");
      } catch (error) {
        console.error("溯源跳转失败：", error);
        showToast("定位失败，请稍后再试", "error");
      }
    }

    /**
     * 构建“🧠 思考过程”折叠区。
     * 有工具调用时逐张渲染卡片；没有时给出明确占位文案，
     * 让用户知道 Agent 确实“直接回答”而非漏掉了处理步骤。
     * trace 存在时按“模型步/工具步”渲染时间线；
     * trace 缺失（旧后端）再退回 tool_calls 卡片逻辑，保证页面不坏。
     * messages 调试视图放在折叠区最底部，与工具卡片同级展示。
     */
    function buildThinkingDetails(toolCalls, messages, trace) {
      const details = createEl("details", "thinking");
      details.appendChild(createEl("summary", "", "🧠 思考过程"));

      if (Array.isArray(trace) && trace.length > 0) {
        // 新后端：trace 已包含“模型直接回答”这一步，
        // 不能再显示旧的“本轮未调用工具”占位，否则会误导
        details.appendChild(buildTraceTimeline(trace));
      } else if (toolCalls.length === 0) {
        // 旧后端降级路径：只有 tool_calls 时仍保留原有提示
        details.appendChild(createEl("div", "no-tools", "本轮未调用工具，直接回答"));
      } else {
        const container = createEl("div", "tool-cards");
        toolCalls.forEach(function (toolCall) {
          container.appendChild(buildToolCard(toolCall));
        });
        details.appendChild(container);
      }

      // 无 messages 字段时不显示（可能是旧后端响应），保持页面兼容
      const messagesView = buildMessagesView(messages);
      if (messagesView) {
        details.appendChild(messagesView);
      }
      return details;
    }

    /**
     * 把 trace 数组渲染成纵向时间线。
     * trace 元素只有两种 kind：model（模型思考）与 tool（工具执行）；
     * 按数组顺序遍历即得到真实发生顺序，不依赖 round 字段排序。
     */
    function buildTraceTimeline(trace) {
      const timeline = createEl("div", "trace-timeline");
      trace.forEach(function (step, index) {
        if (step && step.kind === "model") {
          timeline.appendChild(buildModelStepCard(step, index));
        } else if (step && step.kind === "tool") {
          timeline.appendChild(buildTraceToolCard(step, index));
        }
        // 未知 kind 直接跳过：宁可少显示一步，也不渲染错误内容误导用户
      });
      return timeline;
    }

    /**
     * 构建“模型思考”步卡片。
     * 用 round 或数组下标推导“第 N+1 轮”，展示模型决定了什么；
     * content 只预览前 100 字，详情在气泡正文里看即可。
     */
    function buildModelStepCard(step, index) {
      const roundNo =
        typeof step.round === "number" ? step.round + 1 : index + 1;
      const card = createEl("div", "trace-card model-step");
      card.appendChild(
        createEl("div", "step-title", "🤖 第 " + roundNo + " 轮 · 模型思考")
      );

      // tools_requested 空数组=模型这轮没调工具；
      // 这正是旧 tool_calls 结构表达不了的“纯闲聊也请求了模型”的信息
      const requested = Array.isArray(step.tools_requested)
        ? step.tools_requested
        : [];
      const desc =
        requested.length > 0
          ? "模型决定调用工具：" + requested.join("、")
          : "模型直接给出回答，未调用工具";
      card.appendChild(createEl("div", "step-desc", desc));

      const content = (step.content || "").trim();
      if (content) {
        const preview =
          content.length > 100 ? content.slice(0, 100) + "…" : content;
        card.appendChild(
          createEl("div", "step-preview", "回答正文预览：" + preview)
        );
      }
      return card;
    }

    /**
     * 构建“执行工具”步卡片：复用现有工具卡片外观，
     * 仅把标题替换成带轮次与中文名的“第 N 轮 · 执行工具”格式。
     */
    function buildTraceToolCard(step, index) {
      const rawName = step.tool || "unknown_tool";
      const displayName = TOOL_LABELS[rawName] || rawName;
      const roundNo =
        typeof step.round === "number" ? step.round + 1 : index + 1;
      const title =
        "🔧 第 " +
        roundNo +
        " 轮 · 执行工具：" +
        displayName +
        "（" +
        rawName +
        "）";
      // step 的 tool/args/result 与旧 tool_calls 元素同构，可直接复用渲染
      return buildToolCard(step, title, "trace-card tool-card tool-step");
    }

    /**
     * 构建“📜 messages 数组”调试折叠块。
     * 参数：messages——后端本轮发给模型的完整消息数组（可缺省）。
     * 返回：details 元素；数组缺失或为空时返回 null（上层决定不显示）。
     */
    function buildMessagesView(messages) {
      if (!Array.isArray(messages) || messages.length === 0) {
        return null;
      }

      const view = createEl("details", "messages-view");
      view.appendChild(
        createEl(
          "summary",
          "",
          "📜 messages 数组（本轮发给模型的完整上下文）"
        )
      );

      // 此视图包含完整 system 提示词，等于把“内部提示工程”暴露给页面；
      // 本地调试/教学很有用，但公网部署必须移除该块（见下方提示与注释）
      view.appendChild(
        createEl(
          "div",
          "debug-note",
          "⚠️ 此视图会暴露系统提示词与完整上下文，仅用于本地调试，公网部署时应关闭。"
        )
      );

      // JSON.stringify(…, null, 2) 负责缩进美化；
      // 内容再交给 .code（pre + textContent）渲染，保留格式且不执行 HTML
      const jsonPre = createEl(
        "pre",
        "code",
        JSON.stringify(messages, null, 2)
      );
      view.appendChild(jsonPre);
      return view;
    }

    /**
     * 构建单个工具卡片：工具名 + 美化后的 args + 原始 result。
     * 返回结构按后端契约 {tool, args, result}；字段缺失时做兜底。
     * className 与 titleOverride 供时间线里的工具步复用本卡片样式。
     */
    function buildToolCard(toolCall, titleOverride, className) {
      const card = createEl("div", className || "tool-card");
      const rawName = toolCall.tool || "unknown_tool";
      const displayName = TOOL_LABELS[rawName] || rawName;

      const head = createEl("div", "tool-name");
      head.textContent =
        titleOverride || "工具：" + displayName + "（" + rawName + "）";
      card.appendChild(head);

      const argsTitle = createEl("div", "block-title", "参数（args）");
      card.appendChild(argsTitle);

      // args 是模型生成的 JSON 字符串；JSON.stringify(…, null, 2)
      // 能缩进换行，比直接展示一长串更好读
      const argsPre = createEl("pre", "code", prettyJson(toolCall.args));
      card.appendChild(argsPre);

      const resultTitle = createEl("div", "block-title", "工具返回（result）");
      card.appendChild(resultTitle);

      // pre + textContent 同时做到“保留换行”与“不执行 HTML”，
      // 后端结果即使含 <script> 也只会被当纯文本展示
      const resultPre = createEl(
        "pre",
        "code",
        toolCall.result === undefined || toolCall.result === null
          ? "（无返回结果）"
          : String(toolCall.result)
      );
      card.appendChild(resultPre);
      return card;
    }

    /**
     * 把工具参数字符串格式化成美观的 JSON。
     * 为什么 try/catch：模型偶尔返回空串或非法 JSON；
     * 直接 JSON.parse 会抛异常中断整条消息渲染，
     * 所以解析失败时原样展示字符串让用户/开发者能看到真实数据。
     */
    function prettyJson(raw) {
      if (typeof raw !== "string" || raw.trim() === "") {
        return "";
      }
      try {
        const parsed = JSON.parse(raw);
        return JSON.stringify(parsed, null, 2);
      } catch (error) {
        return raw;
      }
    }

    /**
     * 把聊天滚动区滚到最底部，新气泡出现时始终可见。
     * 用 scrollTop=scrollHeight 比 scrollIntoView 更直接，不改变焦点。
     */
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /**
     * 输入框自动增高：内容多时不再需要滚动小框，
     * 但限制 max-height，避免长文本把发送按钮挤到看不见。
     */
    function autoResizeInput() {
      messageInputEl.style.height = "auto";
      const nextHeight = Math.min(messageInputEl.scrollHeight, 140);
      messageInputEl.style.height = nextHeight + "px";
    }

    /**
     * 切换“请求中”状态：禁用输入与发送按钮，并显示思考中。
     * 为什么必须禁用：同一条 user 消息只应发给后端一次，
     * 否则多轮并发请求会打乱 messages 表与 LLM 上下文的先后顺序。
     */
    function setBusy(nextBusy) {
      busy = nextBusy;
      messageInputEl.disabled = nextBusy;
      sendButtonEl.disabled = nextBusy;
      statusLineEl.textContent = nextBusy ? "思考中…" : "";
    }

    /**
     * 发送当前输入框内容：构造 payload → 调 /api/chat → 渲染结果。
     * 成功/失败都会把输入框还回来，并自动滚动到最新内容。
     */
    async function sendMessage() {
      const text = messageInputEl.value.trim();
      // isLoadingHistory 期间直接不发：历史还没渲染完，先发会把新问答
      // 插到旧消息前面（顺序错乱）。输入框内容保留，回填完成后可再点发送
      if (!text || busy || isLoadingHistory) {
        return;
      }

      setBusy(true);
      messageInputEl.value = "";
      autoResizeInput();
      // 先渲染用户气泡（不能等网络），拿到节点引用以便稍后回填消息 id 锚点
      const userNode = appendUserMessage(text);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: getSessionId()
          })
        });

        // 后端错误可能是 JSON（FastAPI 校验错误）也可能是纯文本（500），
        // 先按 JSON 解析，失败再退回纯文本，保证任何失败都有可见提示
        let data = null;
        try {
          data = await response.json();
        } catch (error) {
          const plain = await response.text();
          throw new Error(plain || "HTTP " + response.status);
        }

        if (!response.ok) {
          const detail = data && data.detail;
          if (typeof detail === "string") {
            throw new Error(detail);
          }
          throw new Error("请求失败（HTTP " + response.status + "）");
        }

        // 本轮两条消息的 id 只有后端落库后才知道，气泡却是先画的，
        // 所以在这里补锚点：补完当前这轮对话也能被计划卡片直接跳转，
        // 不必刷新页面等历史渲染
        applyMessageAnchor(userNode, data.user_message_id);
        appendAgentMessage(
          data.reply,
          data.tool_calls,
          data.messages,
          data.trace,
          data.assistant_message_id
        );
        // Agent 可能刚通过 create_note 写了新待办，刷新侧边栏保持一致
        await loadTodos();
      } catch (error) {
        console.error("聊天请求失败：", error);
        const wrapper = createEl("div", "message agent");
        const body = createEl("div", "message agent-body");
        body.appendChild(
          createEl("div", "bubble", "出错了：" + (error.message || "未知错误"))
        );
        wrapper.appendChild(body);
        messagesEl.appendChild(wrapper);
        scrollToBottom();
      } finally {
        setBusy(false);
        messageInputEl.focus();
      }
    }

    // ===== 事件绑定 =====
    chatFormEl.addEventListener("submit", function (event) {
      event.preventDefault(); // 表单默认提交会刷新整页，必须阻止
      sendMessage();
    });

    // 回车即发送；Shift+回车保留多行输入能力（聊天场景更常用）
    messageInputEl.addEventListener("keydown", function (event) {
      // isComposing 为 true 表示正在中文输入法选词，此时的回车是“确认候选词”，
      // 若不判断会把还没写好的句子提前发出去
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    messageInputEl.addEventListener("input", autoResizeInput);
    refreshButtonEl.addEventListener("click", loadTodos);

    // 筛选按钮：委托到容器上统一监听，将来加筛选项不用逐个绑事件
    todoFiltersEl.addEventListener("click", function (event) {
      const button = event.target.closest(".filter-button");
      if (!button) {
        return;
      }
      const nextFilter = button.dataset.filter || "all";
      if (nextFilter === todoFilter) {
        return;  // 重复点当前筛选不重新请求，省一次无用网络往返
      }
      todoFilter = nextFilter;
      // 高亮态直接由 data-filter 对照，保证按钮与状态永远一致
      todoFiltersEl.querySelectorAll(".filter-button").forEach(function (node) {
        node.classList.toggle("active", node.dataset.filter === todoFilter);
      });
      loadTodos();
    });

    // 页面打开：先回填历史对话（有历史就不显示欢迎语），再加载待办。
    // 两个请求互不依赖，但必须分开写：loadHistory 内部有发送锁，
    // 把待办请求塞进同一个 try 会让待办失败连带影响历史回填的提示
    loadHistory();
    loadTodos();
  </script>
</body>
</html>
